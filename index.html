<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>MEGOGO • Кіногід</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial;background:#0b1020;color:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{padding:24px 16px;background:linear-gradient(120deg,#162e51,#101827)}main{max-width:980px;margin:auto;padding:18px 14px}h1{margin:0 0 8px;font-size:27px}.muted{color:#aab6c9;font-size:13px}#status{margin:12px 0 18px}nav{display:flex;gap:8px;overflow:auto;margin:12px 0 20px}button,select,input{background:#1d2b43;color:white;border:1px solid #3c4d68;border-radius:10px;padding:11px;font-size:15px}button.active{background:#2968ad}input{width:100%;margin-bottom:12px}.filters{display:flex;gap:8px}.filters select{min-width:0;flex:1}.item{background:#141f32;border:1px solid #293950;border-radius:14px;padding:15px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.time{font-size:20px;font-weight:750;color:#8cc8ff}.channel{font-size:13px;color:#bed1e8;text-align:right}.movie{font-size:18px;font-weight:650;margin:9px 0}.details{font-size:13px;color:#bac7d9;line-height:1.7}.score{color:#ffd66d}a{color:#8cc8ff}footer{padding:24px 14px;color:#91a2bb;text-align:center;font-size:12px}
</style></head><body><header><main><h1>🎬 MEGOGO • Кіногід</h1><div class="muted">Зведена телепрограма кіноканалів • дані лише з EPG</div></main></header><main>
<div id="status" class="muted">Завантаження програми…</div><nav id="days"></nav><input id="search" type="search" placeholder="Пошук фільму або каналу"><div class="filters"><select id="channel"><option value="">Усі канали</option></select><select id="rating"><option value="0">Будь-який IMDb</option><option value="7">IMDb від 7</option><option value="8">IMDb від 8</option></select></div><div class="filters" style="margin-top:10px"><select id="epgFilter" aria-label="Наявність телепрограми"><option value="all">Усі канали</option><option value="yes">Є програма</option><option value="no">Немає програми</option></select></div><div id="coverage" class="muted" style="margin:12px 0"></div><details id="missingPanel" class="item"><summary>Канали без EPG — показати список</summary><div id="missingNames" class="details" style="margin-top:12px"></div></details><section id="list"></section></main><footer>EPG: IPTV-EPG.org • IMDb — лише підтверджені збіги. Неофіційний телегід, не пов'язаний із MEGOGO.</footer>
<script>
let data={days:[],updated:null};let selected='';const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('uk-UA',{weekday:'short',day:'numeric',month:'short'});
function render(){const days=data.days||[];el('days').innerHTML=days.map(d=>'<button class="'+(selected===d.date?'active':'')+'" data-day="'+esc(d.date)+'">'+esc(dateLabel(d.date))+'</button>').join('');el('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.day;render()});const day=days.find(d=>d.date===selected);const q=el('search').value.trim().toLocaleLowerCase('uk');const channel=el('channel').value;const min=Number(el('rating').value);const epgFilter=el('epgFilter').value;const availableOnDay=new Set((day?.programmes||[]).map(p=>p.channel));const allChannels=Object.values(data.channel_groups||{}).flat();const filteredChannels=allChannels.filter(c=>!c.startsWith('[M] ')&&(epgFilter==='all'||(epgFilter==='yes'?availableOnDay.has(c):!availableOnDay.has(c)))&&(!q||c.toLocaleLowerCase('uk').includes(q))&&(!channel||channel===c));el('missingPanel').style.display=epgFilter==='yes'?'none':'';el('missingPanel').open=epgFilter==='no';el('missingNames').innerHTML=(epgFilter==='no'?filteredChannels:(data.epg_missing||[]).filter(c=>!c.startsWith('[M] '))).map(c=>'<div style="padding:4px 0">'+esc(c)+'</div>').join('')||'Немає каналів';const rows=(day?.programmes||[]).filter(p=>(!channel||p.channel===channel)&&(epgFilter!=='no')&&(!q||(p.title+' '+p.channel).toLocaleLowerCase('uk').includes(q))&&(!min||(p.imdb_rating||0)>=min));el('list').innerHTML=epgFilter==='no'?'<p class="muted">На вибрану дату без програми: '+filteredChannels.length+' каналів. Перелік вище.</p>':rows.length?rows.map(p=>'<article class="item"><div class="top"><span class="time">'+esc(p.start_time)+'</span><span class="channel">'+esc(p.channel)+'</span></div><div class="movie">'+esc(p.title)+'</div><div class="details">'+[p.year||'Рік невідомий',p.genre||'Жанр невідомий',p.imdb_rating?'<span class="score">★ IMDb '+esc(p.imdb_rating)+'</span>':'IMDb не перевірено'].join(' • ')+(p.imdb_id?' • <a target="_blank" rel="noopener" href="https://www.imdb.com/title/'+encodeURIComponent(p.imdb_id)+'/">IMDb ↗</a>':'')+'</div></article>').join(''):'<p class="muted">На цю дату немає відповідних передач. Джерело EPG може не містити розкладу.</p>'}
(async()=>{try{const res=await fetch('./data/guide.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);data=await res.json();if(!data.channel_groups||!Array.isArray(data.epg_available)){el('status').textContent='EPG оновлюється: старий файл із зайвими каналами приховано. Перевірте GitHub Actions.';el('coverage').textContent='Очікуємо оновлений розклад вибраних каналів.';el('list').innerHTML='';return;}selected=data.days?.find(d=>d.date===new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Kyiv'}))?.date||data.days?.[0]?.date||'';const channels=Object.values(data.channel_groups||{}).flat();el('coverage').textContent='Каналів у списку: '+channels.length+' • EPG знайдено: '+(data.epg_available||[]).length+' • без EPG: '+(data.epg_missing||[]).length;el('missingNames').innerHTML=(data.epg_missing||[]).filter(c=>!c.startsWith('[M] ')).map(c=>'<div style="padding:4px 0">'+esc(c)+'</div>').join('')||'Усі канали мають EPG';el('channel').innerHTML='<option value="">Усі канали</option>'+channels.map(c=>'<option value="'+esc(c)+'">'+esc(c)+((data.epg_missing||[]).includes(c)?' — немає EPG':'')+'</option>').join('');el('status').textContent='Оновлено: '+(data.updated||'невідомо')+' • каналів у списку: '+channels.length+' • джерело: '+(data.source||'EPG');render()}catch(e){el('status').textContent='Програма ще не сформована або недоступна: '+e.message}})();['search','channel','rating','epgFilter'].forEach(id=>el(id).addEventListener('input',render));
</script></body></html>
