name: Update EPG guide
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_guide.py'
      - 'scripts/imdb_enrich.py'
      - 'config/megogo_channels.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: epg-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and process EPG
        run: python scripts/build_guide.py
      - name: Commit refreshed programme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/guide.json data/imdb_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily EPG"
            # Other changes may land while the EPG is being generated.
            # Rebase the generated commit onto the latest main before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git -c rebase.autoStash=true rebase -X ours origin/main || {
                git rebase --abort || true
                echo "Rebase failed; retry requires manual inspection"
                exit 1
              }
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Failed to push EPG after retries"
            exit 1
          fi
